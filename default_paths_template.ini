# Default folders of the DTS GUI.
#
# 1. Copy this file to default_paths.ini, in the same folder
#    (cp default_paths_template.ini default_paths.ini).
# 2. Enter, after each "=", the FULL path of that folder on your computer,
#    without quotes; spaces in the path are fine; ~ stands for your home
#    folder.  Leave a value empty when you do not have that data: the field
#    then starts empty in the GUI.
# default_paths.ini is personal and is never pushed to GitHub (.gitignore);
# only this template is.

[folders]
# XT temperature folder: holds one sub-folder per configuration of the
# Silixa XT (raw WITSML files) and, after preprocessing, DTS_preprocessed.nc
# in each of them.  Used by Load raw data and Load preprocessed data.
# Example: /Users/me/data/MIRAGE/DTS/XT13002/temperature
xt_temperature =

# LeXPLORE thermistor-chain folder (Datalakes Level-2 NetCDF files L2_*.nc).
# Example: /Users/me/data/MIRAGE/LEXPLORE_TEMPERATURE_CHAIN
lexplore =

# STC profiler folder (SWiFT SVP .csv and .vp2 files, and the lake outline
# Lake_Geneva_outline.geojson).  Used by Advanced > Sound speed maps.
# Example: /Users/me/data/MIRAGE/STC PROFILES
stc =

# DTS folder searched (sub-folders included) for the preprocessed files,
# for the comparison with the STC profiles.
# Example: /Users/me/data/MIRAGE/DTS
dts =
